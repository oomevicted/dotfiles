[main]
shell=/usr/bin/fish
font=monospace:size=10
pad=10x10

[colors]
alpha=0.85

foreground=cccccc
background=000000

regular0=000000
regular1=8b0000
regular2=558855
regular3=aaaa55
regular4=5555aa
regular5=aa55aa
regular6=55aaaa
regular7=cccccc

bright0=333333
bright1=ff4444
bright2=77aa77
bright3=cccc77
bright4=7777cc
bright5=cc77cc
bright6=77cccc
bright7=ffffff

[cursor]
color=000000 cccccc
style=block
blink=yes

[mouse]
hide-when-typing=yes
